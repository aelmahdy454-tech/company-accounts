<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابات الشركة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2f5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3f5f9;--card:rgba(255,255,255,.94);--ink:#101a2b;--mut:#65728a;--line:#e3e8f0;
  --navy:#0b2f5b;--navy2:#1d4f91;--gold:#c9a227;--goldSoft:#fbf3d5;
  --ok:#17794a;--okBg:#e3f5ea;--bad:#b83227;--badBg:#fbe8e5;--warn:#a8650c;
  --shadow:0 8px 24px rgba(16,26,43,.08);--crest:.16;
  box-sizing:border-box;
}
:root[data-theme="dark"]{
  --bg:#0b1119;--card:rgba(20,30,43,.94);--ink:#e8edf5;--mut:#8f9db3;--line:#243245;
  --navy:#0b2f5b;--navy2:#2a64b5;--gold:#e6bd3e;--goldSoft:#2b2612;
  --ok:#6fd49c;--okBg:#15321f;--bad:#ff8f84;--badBg:#3b1e1b;--warn:#f0bd6a;
  --shadow:0 8px 24px rgba(0,0,0,.35);--crest:.10;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-size:16px;line-height:1.6;min-height:100%}
body{max-width:680px;margin:0 auto;padding:env(safe-area-inset-top,0px) 0 110px;position:relative}
body::before{content:"";position:fixed;inset:0;background:url('crest.png') center 58% no-repeat;background-size:min(88vw,520px) auto;opacity:var(--crest);pointer-events:none;z-index:0}
body>*{position:relative;z-index:1}
h1{margin:0;font-size:22px;font-weight:800}
h2{font-size:15px;margin:22px 18px 8px;font-weight:800;color:var(--navy2)}
:root[data-theme="dark"] h2{color:var(--gold)}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.btn{border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:700;background:var(--navy2);color:#fff;cursor:pointer}
.btn.g{background:var(--line);color:var(--ink)}
.btn.r{background:var(--badBg);color:var(--bad)}
.btn.gold{background:var(--gold);color:#1a1405}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.err{color:var(--bad);font-size:14px;margin-top:8px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.top .hi{font-size:13px;color:var(--mut)}
.dots{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:900;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}

/* hero */
.hero{margin:10px 16px 4px;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(201,162,39,.22)}
.hero.neg{background:linear-gradient(135deg,#6b1f1a 0%,#b83227 100%)}
.hero small{display:block;font-size:14px;opacity:.85;position:relative;z-index:1}
.hero b{display:block;font-size:36px;font-weight:800;line-height:1.3;position:relative;z-index:1}
.hero .chip2{display:inline-block;margin-top:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px;font-size:13px;position:relative;z-index:1}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px}
.k{padding:14px}
.k span{display:block;font-size:12.5px;color:var(--mut)}
.k b{font-size:18px;font-weight:800}
.k.acc{border-right:4px solid var(--gold)}

.bars{margin:0 16px;padding:14px}
.br{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.br em{font-style:normal;width:70px;color:var(--mut);flex:none}
.br i{display:block;height:10px;border-radius:6px;min-width:3px}
.br span{min-width:90px;text-align:left;font-weight:700}

.tbl{margin:0 16px;display:grid;gap:10px}
.p{padding:14px}
.p .t{display:flex;justify-content:space-between;font-weight:700}
.p .d{font-size:13px;color:var(--mut);margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}

.sel{display:flex;gap:8px;padding:6px 16px;flex-wrap:wrap}
.sel>*{flex:1;min-width:120px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.tx{padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.tx .m{flex:1;min-width:0}.tx .n{font-weight:700}
.tx .d{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx b{white-space:nowrap}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--goldSoft);color:var(--warn)}
.empty{margin:24px 16px;padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:18px}

/* bottom nav */
nav{position:fixed;bottom:12px;left:12px;right:12px;max-width:656px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:6px 8px;z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer}
nav button.on{color:var(--navy2);font-weight:800}
:root[data-theme="dark"] nav button.on{color:var(--gold)}
nav .add{flex:none;width:58px;height:58px;margin-top:-30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e6c85a);color:#1a1405;font-size:32px;line-height:1;box-shadow:0 8px 20px rgba(201,162,39,.45);padding:0}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.5);display:none;z-index:20}
.sheet.open{display:block}
.sheet>div{position:absolute;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;max-height:92%;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;color:var(--ink);font-size:18px}

/* login */
.login{max-width:380px;margin:50px auto 0;padding:26px;text-align:center}
.login img{width:110px;height:auto;display:block;margin:0 auto 6px}
.login .card-in{text-align:right}

/* account */
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--navy2),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800;margin:0 auto;overflow:hidden;cursor:pointer;border:3px solid var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:6px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:inherit;color:var(--mut);cursor:pointer;font-weight:700}
.seg button.on{background:var(--navy2);color:#fff}
.menuitem{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:600}
.menuitem:last-child{border-bottom:0}
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="card login">
    <img src="crest.png" alt="ريال مدريد">
    <h1>حسابات الشركة</h1>
    <div class="sub">سجّل دخول بالإيميل والباسورد</div>
    <form class="card-in" id="lform" autocomplete="on">
      <label>الإيميل</label><input id="em" type="email" name="username" autocomplete="username">
      <label>الباسورد</label><input id="pw" type="password" name="password" autocomplete="current-password">
      <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="rem" type="checkbox" checked style="width:auto;margin:0"> تذكّر الإيميل على الجهاز</label>
      <div class="row"><button class="btn" id="lg" type="submit" style="width:100%">دخول</button></div>
      <div class="err" id="lerr"></div>
    </form>
  </div>
</div>

<div id="shell" style="display:none">
  <div class="top">
    <div><div class="hi" id="hi"></div><h1 id="ttl">حسابات الشركة</h1></div>
    <button class="dots" id="dots" aria-label="الإعدادات">⋮</button>
  </div>
  <main id="app"></main>
  <nav>
    <button data-v="sum" class="on">الملخص</button>
    <button data-v="tx">الحركات</button>
    <button class="add" id="addBtn" aria-label="حركة جديدة">+</button>
    <button data-v="prj">المشاريع</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div id="sbody"></div></div>

<script>
const SB_URL='https://borabhftnownisrrqwrz.supabase.co';
const SB_KEY='sb_publishable_BD9xkzoyLHXFfDt1IYWu7w_csqZmuch';
const sb=supabase.createClient(SB_URL,SB_KEY);

const KINDS={sale:'بيع',ad:'إعلان',exp:'مصروف'};
const PLAT=['فيسبوك','انستجرام','جوجل','تيك توك','يوتيوب','أخرى'];
const CATS=['ضرائب','مرتبات','إيجار','كهرباء ومياه','مواصلات','صيانة','تسويق عام','أخرى'];
const ROLE_AR={owner:'اونر',editor:'محرر',viewer:'مشاهد'};
const TBL_AR={transactions:'حركة',projects:'مشروع'};

let ME=null,ROLE=null,T=[],P=[],view='sum',per='all',pf='all',tf='all',df='',dtt='';

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const mon=off=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return iso(d).slice(0,7)};
const money=n=>Math.round(n||0).toLocaleString('ar-EG')+' ج.م';
const num=n=>Math.round(n||0).toLocaleString('ar-EG');
const ratio=n=>isFinite(n)?(Math.round(n*10)/10).toLocaleString('ar-EG')+'×':'—';
const canEdit=()=>ROLE==='owner'||ROLE==='editor';
const pname=id=>{const p=P.find(x=>x.id===id);return p?p.name:'عام'};
const initials=()=>{const e=(ME&&ME.email)||'?';return e.charAt(0).toUpperCase()};
const avatarKey=()=>'avatar:'+(ME?ME.id:'');

function inPer(t){
  const d=t.date||'';
  if(df&&d<df)return false;
  if(dtt&&d>dtt)return false;
  if(per==='m0')return d.slice(0,7)===mon(0);
  if(per==='m1')return d.slice(0,7)===mon(-1);
  if(per==='y')return d.slice(0,4)===today().slice(0,4);
  return true;
}
function list(){return T.filter(t=>inPer(t)&&(pf==='all'||t.project_id===pf))}

function stats(a){
  const s={sales:0,apt:0,vil:0,units:0,ad:0,exp:0,tax:0,gross:0,comm:0,disc:0};
  a.forEach(t=>{
    const v=+t.amount||0;
    if(t.kind==='sale'){
      s.sales+=v;s.gross+=+t.commission||0;s.comm+=+t.sales_commission||0;s.disc+=+t.discount||0;
      const u=+t.units||1;
      if(t.unit_type==='فيلا')s.vil+=u;else s.apt+=u;
    }else if(t.kind==='ad'){s.ad+=v}
    else if(t.category==='ضرائب'){s.tax+=v}
    else{s.exp+=v}
  });
  s.units=s.apt+s.vil;
  s.cost=s.ad+s.exp+s.tax+s.comm+s.disc;
  s.profit=s.gross-s.cost;
  s.margin=s.gross?s.profit/s.gross*100:NaN;
  s.roas=s.ad?s.gross/s.ad:NaN;
  s.cpu=s.units?s.ad/s.units:NaN;
  return s;
}

function filters(){
  return '<div class="sel"><input id="df" type="date" value="'+df+'" title="من"><input id="dtt" type="date" value="'+dtt+'" title="إلى"></div>'+
  '<div class="sel"><select id="per"><option value="all">كل الفترات</option><option value="m0">الشهر ده</option><option value="m1">الشهر اللي فات</option><option value="y">السنة دي</option></select>'+
  '<select id="pf"><option value="all">كل المشاريع</option>'+P.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div>';
}
function bindFilters(){
  const f1=document.getElementById('df'),f2=document.getElementById('dtt');
  if(f1){f1.onchange=()=>{df=f1.value;render()};f2.onchange=()=>{dtt=f2.value;render()}}
  const a=document.getElementById('per'),b=document.getElementById('pf');
  if(!a)return;
  a.value=per;b.value=pf;
  a.onchange=()=>{per=a.value;render()};
  b.onchange=()=>{pf=b.value;render()};
}
function bar(label,v,max,col){return '<div class="br"><em>'+label+'</em><i style="width:'+Math.max(0,Math.round(v/(max||1)*100))+'%;background:'+col+'"></i><span>'+num(v)+' ج</span></div>'}

const TITLES={sum:'الملخص',tx:'الحركات',prj:'المشاريع',log:'سجل العمليات'};
function render(){
  if(!ME)return;
  const app=document.getElementById('app');
  document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.getElementById('addBtn').style.display=canEdit()?'':'none';
  document.getElementById('ttl').textContent=TITLES[view]||'';
  document.getElementById('hi').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});

  if(view==='sum'){
    const s=stats(list()),neg=s.profit<0,mx=Math.max(s.gross,s.cost,1);
    let h=filters();
    h+='<div class="hero'+(neg?' neg':'')+'"><small>'+(neg?'صافي الخسارة':'صافي الربح')+'</small><b>'+money(Math.abs(s.profit))+'</b><span class="chip2">هامش الربح '+(isFinite(s.margin)?(Math.round(s.margin*10)/10).toLocaleString('ar-EG')+'٪':'—')+' من العمولة</span></div>';
    h+='<div class="grid">'+
      '<div class="k card acc"><span>عمولة المطورين</span><b>'+money(s.gross)+'</b></div>'+
      '<div class="k card"><span>إجمالي المبيعات</span><b>'+money(s.sales)+'</b></div>'+
      '<div class="k card"><span>الوحدات المباعة</span><b>'+num(s.units)+'</b><span>'+num(s.apt)+' شقة · '+num(s.vil)+' فيلا</span></div>'+
      '<div class="k card"><span>عائد الإعلان</span><b>'+ratio(s.roas)+'</b><span>عمولة لكل جنيه إعلان</span></div>'+
      '<div class="k card"><span>الإعلانات</span><b>'+money(s.ad)+'</b></div>'+
      '<div class="k card"><span>مصروفات عامة</span><b>'+money(s.exp)+'</b></div>'+
      '<div class="k card"><span>الضرائب</span><b>'+money(s.tax)+'</b></div>'+
      '<div class="k card"><span>عمولة السيلز</span><b>'+money(s.comm)+'</b></div>'+
      '<div class="k card"><span>الخصومات</span><b>'+money(s.disc)+'</b></div>'+
      '<div class="k card"><span>إجمالي الخصومات والمصروفات</span><b>'+money(s.cost)+'</b></div>'+
      '</div>';
    h+='<h2>العمولة مقابل المصروفات</h2><div class="bars card">'+bar('عمولات',s.gross,mx,'var(--ok)')+bar('إعلانات',s.ad,mx,'var(--warn)')+bar('مصروفات',s.cost-s.ad,mx,'var(--navy2)')+'</div>';
    if(pf==='all'&&P.length){
      h+='<h2>حسب المشروع</h2><div class="tbl">'+P.map(p=>{
        const ps=stats(T.filter(t=>inPer(t)&&t.project_id===p.id));
        return '<div class="p card"><div class="t"><span>'+esc(p.name)+'</span><span class="'+(ps.profit<0?'neg':'pos')+'">'+money(ps.profit)+'</span></div><div class="d">عمولة '+money(ps.gross)+' · إعلانات '+money(ps.ad)+' · عائد الإعلان '+ratio(ps.roas)+' · '+num(ps.apt)+' شقة · '+num(ps.vil)+' فيلا</div></div>';
      }).join('')+'</div>';
    }
    if(!T.length)h+='<div class="empty">'+(canEdit()?'دوس على + وسجّل أول حركة':'مفيش حركات مسجلة لسه')+'</div>';
    app.innerHTML=h;bindFilters();
  }
  else if(view==='tx'){
    const chips=[['all','الكل'],['sale','مبيعات'],['ad','إعلانات'],['exp','مصروفات']].map(c=>'<button class="chip'+(tf===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('');
    const arr=list().filter(t=>tf==='all'||t.kind===tf).sort((x,y)=>(y.date||'')>(x.date||'')?1:-1);
    app.innerHTML=filters()+'<div class="chips">'+chips+'</div><div class="tbl" style="margin-top:8px">'+(arr.map(t=>{
      const sale=t.kind==='sale';
      let sub=esc(t.date);
      if(sale)sub+=' · '+num(t.units||1)+' '+esc(t.unit_type||'شقة')+' · عمولة '+money(t.commission);
      else if(t.category)sub+=' · '+esc(t.category);
      if(t.note)sub+=' · '+esc(t.note);
      return '<div class="tx card" data-id="'+t.id+'"><div class="m"><div class="n">'+KINDS[t.kind]+' · '+esc(pname(t.project_id))+'</div><div class="d">'+sub+'</div></div><b class="'+(sale?'pos':'neg')+'">'+(sale?'+':'−')+money(t.amount)+'</b></div>';
    }).join('')||'<div class="empty">مفيش حركات</div>')+'</div>';
    bindFilters();
  }
  else if(view==='prj'){
    app.innerHTML='<h2>المشاريع</h2><div class="tbl">'+(P.map(p=>{
      const ps=stats(T.filter(t=>t.project_id===p.id));
      return '<div class="p card" data-p="'+p.id+'"><div class="t"><span>'+esc(p.name)+'</span><span class="sub">تعديل</span></div><div class="d">عمولة '+money(ps.gross)+' · إعلانات '+money(ps.ad)+' · عائد الإعلان '+ratio(ps.roas)+'</div></div>';
    }).join('')||'<div class="empty">ضيف أول مشروع</div>')+'</div>'+
    (canEdit()?'<div class="row" style="padding:0 16px"><button class="btn" id="np" style="width:100%">+ مشروع جديد</button></div>':'');
    const np=document.getElementById('np');if(np)np.onclick=()=>prjSheet('');
  }
  else if(view==='log'){
    app.innerHTML='<div id="logbox"><div class="empty">جاري التحميل…</div></div>';
    loadLog();
  }
}

/* ---------- password re-check ---------- */
function askPassword(title){
  return new Promise(resolve=>{
    document.getElementById('sbody').innerHTML='<h2>'+esc(title)+'</h2><div class="sub">اكتب الباسورد بتاعك عشان تكمل</div>'+
      '<label>الباسورد</label><input id="rp" type="password" autocomplete="current-password">'+
      '<div class="err" id="rerr"></div>'+
      '<div class="row"><button class="btn" id="rok" style="flex:1">تأكيد</button><button class="btn g" id="rno" style="flex:1">إلغاء</button></div>';
    document.getElementById('sheet').classList.add('open');
    const pw=document.getElementById('rp');pw.focus();
    document.getElementById('rno').onclick=()=>{close();resolve(false)};
    document.getElementById('rok').onclick=async()=>{
      const {error}=await sb.auth.signInWithPassword({email:ME.email,password:pw.value});
      if(error){document.getElementById('rerr').textContent='الباسورد غلط';return}
      close();resolve(true);
    };
  });
}

/* ---------- transactions ---------- */
function txSheet(id){
  const orig=T.find(x=>x.id===id),isNew=!orig;
  const t=orig?Object.assign({},orig):{kind:'sale',date:today(),project_id:pf==='all'?'':pf,amount:'',units:1,unit_type:'شقة',category:'',note:'',commission:'',sales_commission:'',discount:0};
  let h='<h2>'+(isNew?'حركة جديدة':'تعديل حركة')+'</h2>';
  h+='<label>النوع</label><select id="k">'+Object.keys(KINDS).map(k=>'<option value="'+k+'"'+(t.kind===k?' selected':'')+'>'+KINDS[k]+'</option>').join('')+'</select>';
  h+='<label>المشروع</label><select id="pj"><option value="">عام (غير مرتبط بمشروع)</option>'+P.map(p=>'<option value="'+p.id+'"'+(t.project_id===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>';
  h+='<label id="la">المبلغ (جنيه)</label><input id="am" type="number" inputmode="decimal" value="'+esc(t.amount)+'">';
  h+='<div id="sx"><label>عدد الوحدات</label><input id="un" type="number" min="1" value="'+esc(t.units||1)+'"><label>نوع الوحدة</label><select id="ut">'+opts(['شقة','فيلا'],t.unit_type)+'</select>'+
     '<label>قيمة عمولة المطور (جنيه)</label><input id="cm" type="number" inputmode="decimal" value="'+esc(t.commission||'')+'">'+
     '<label>قيمة عمولة السيلز (جنيه)</label><input id="sc" type="number" inputmode="decimal" value="'+esc(t.sales_commission||'')+'">'+
     '<label>خصم (جنيه)</label><input id="ds" type="number" min="0" value="'+esc(t.discount||0)+'"></div>';
  h+='<div id="cx"><label id="lc">التصنيف</label><select id="ct"></select></div>';
  h+='<label>التاريخ</label><input id="dt2" type="date" value="'+esc(t.date)+'"><label>ملاحظة</label><input id="nt" value="'+esc(t.note||'')+'">';
  h+='<div class="row"><button class="btn" id="sv" style="flex:1">حفظ</button><button class="btn g" id="cl" style="flex:1">إغلاق</button>'+(isNew?'':'<button class="btn r" id="dl" style="width:100%">حذف</button>')+'</div>';
  document.getElementById('sbody').innerHTML=h;
  document.getElementById('sheet').classList.add('open');
  function sync(){
    const k=document.getElementById('k').value;
    document.getElementById('sx').style.display=k==='sale'?'':'none';
    document.getElementById('cx').style.display=k==='sale'?'none':'';
    document.getElementById('la').textContent=k==='sale'?'قيمة البيع (جنيه)':'المبلغ (جنيه)';
    document.getElementById('lc').textContent=k==='ad'?'المنصة':'التصنيف';
    document.getElementById('ct').innerHTML=opts(k==='ad'?PLAT:CATS,t.category);
  }
  document.getElementById('k').onchange=()=>{t.category='';sync()};
  sync();
  document.getElementById('cl').onclick=close;
  document.getElementById('sv').onclick=async()=>{
    const k=document.getElementById('k').value,am=+document.getElementById('am').value;
    if(!(am>0)){alert('اكتب مبلغ صحيح');return}
    const o={kind:k,project_id:document.getElementById('pj').value||null,amount:am,date:document.getElementById('dt2').value||today(),note:document.getElementById('nt').value.trim(),category:k==='sale'?null:document.getElementById('ct').value};
    if(k==='sale'){
      o.units=Math.max(1,+document.getElementById('un').value||1);
      o.unit_type=document.getElementById('ut').value;
      o.commission=+document.getElementById('cm').value||0;
      o.sales_commission=+document.getElementById('sc').value||0;
      o.discount=+document.getElementById('ds').value||0;
    }
    if(!isNew){
      const ok=await askPassword('تعديل الحركة');
      if(!ok)return;
    }
    const q=isNew?sb.from('transactions').insert(o):sb.from('transactions').update(o).eq('id',id);
    const {error}=await q;
    if(error){alert('تعذر الحفظ: '+error.message);return}
    close();await load();
  };
  const d=document.getElementById('dl');
  if(d)d.onclick=async()=>{
    if(!confirm('تمسح الحركة دي؟'))return;
    const ok=await askPassword('حذف الحركة');
    if(!ok)return;
    const {error}=await sb.from('transactions').delete().eq('id',id);
    if(error){alert('تعذر الحذف: '+error.message);return}
    close();await load();
  };
}
function opts(arr,sel){return arr.map(x=>'<option'+(x===sel?' selected':'')+'>'+x+'</option>').join('')}

/* ---------- projects ---------- */
function prjSheet(id){
  const p=P.find(x=>x.id===id),isNew=!p;
  document.getElementById('sbody').innerHTML='<h2>'+(isNew?'مشروع جديد':'تعديل المشروع')+'</h2><label>اسم المشروع</label><input id="pn" value="'+esc(p?p.name:'')+'"><div class="row"><button class="btn" id="sv" style="flex:1">حفظ</button><button class="btn g" id="cl" style="flex:1">إغلاق</button>'+(isNew?'':'<button class="btn r" id="dl" style="width:100%">حذف</button>')+'</div>';
  document.getElementById('sheet').classList.add('open');
  document.getElementById('cl').onclick=close;
  document.getElementById('sv').onclick=async()=>{
    const n=document.getElementById('pn').value.trim();
    if(!n){alert('اكتب اسم المشروع');return}
    if(!isNew){if(!(await askPassword('تعديل المشروع')))return}
    const q=isNew?sb.from('projects').insert({name:n}):sb.from('projects').update({name:n}).eq('id',id);
    const {error}=await q;
    if(error){alert('تعذر الحفظ: '+error.message);return}
    close();await load();
  };
  const d=document.getElementById('dl');
  if(d)d.onclick=async()=>{
    if(!confirm('تمسح المشروع؟ الحركات المسجلة عليه هتفضل وتظهر كـ "عام".'))return;
    if(!(await askPassword('حذف المشروع')))return;
    const {error}=await sb.from('projects').delete().eq('id',id);
    if(error){alert('تعذر الحذف: '+error.message);return}
    close();await load();
  };
}
function close(){document.getElementById('sheet').classList.remove('open')}

/* ---------- audit log (owner) ---------- */
function summarize(r){
  const d=r.new_data||r.old_data||{};
  if(r.table_name==='projects')return esc(d.name||'');
  const kind=KINDS[d.kind]||'';
  return kind+' · '+money(d.amount)+(d.kind==='sale'?' · عمولة '+money(d.commission):(d.category?' · '+esc(d.category):''));
}
async function loadLog(){
  const box=document.getElementById('logbox');
  if(ROLE!=='owner'){box.innerHTML='<div class="empty">السجل للاونر بس</div>';return}
  const {data,error}=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(300);
  if(error){box.innerHTML='<div class="empty">تعذر تحميل السجل</div>';return}
  const actName={INSERT:'إضافة',UPDATE:'تعديل',DELETE:'مسح'};
  const actCls={INSERT:'pos',UPDATE:'pill',DELETE:'neg'};
  box.innerHTML='<div class="tbl" style="margin-top:8px">'+(data.map(r=>{
    const when=new Date(r.created_at).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});
    return '<div class="p card"><div class="t"><span>'+actName[r.action]+' '+(TBL_AR[r.table_name]||'')+'</span><span class="'+actCls[r.action]+'" style="font-size:13px">'+esc(r.actor_email||'غير معروف')+'</span></div><div class="d">'+summarize(r)+'</div><div class="d">'+esc(when)+'</div></div>';
  }).join('')||'<div class="empty">مفيش عمليات مسجلة</div>')+'</div>';
}

/* ---------- account menu ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('theme',t);
}
function menuSheet(){
  const av=localStorage.getItem(avatarKey());
  const th=document.documentElement.getAttribute('data-theme');
  document.getElementById('sbody').innerHTML=
    '<div class="avatar" id="avb">'+(av?'<img src="'+av+'" alt="">':esc(initials()))+'</div>'+
    '<input id="avf" type="file" accept="image/*" style="display:none">'+
    '<div class="sub" style="text-align:center;margin-top:6px">اضغط الصورة عشان تغيّرها</div>'+
    '<div class="card" style="padding:6px 14px;margin-top:14px">'+
      '<div class="menuitem"><span>الإيميل</span><span style="font-size:14px">'+esc(ME.email)+'</span></div>'+
      '<div class="menuitem"><span>الصلاحية</span><span class="pill">'+esc(ROLE_AR[ROLE]||'')+'</span></div>'+
    '</div>'+
    '<h2 style="margin-top:14px">الشكل</h2>'+
    '<div class="seg"><button id="tl" class="'+(th==='light'?'on':'')+'">نهاري</button><button id="td" class="'+(th==='dark'?'on':'')+'">ليلي</button></div>'+
    (ROLE==='owner'?'<div class="row"><button class="btn gold" id="mlog" style="width:100%">سجل العمليات</button></div>':'')+
    '<div class="row"><button class="btn r" id="mout" style="width:100%">خروج</button></div>';
  document.getElementById('sheet').classList.add('open');
  document.getElementById('avb').onclick=()=>document.getElementById('avf').click();
  document.getElementById('avf').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>400000){alert('الصورة كبيرة، اختار صورة أصغر من 400 كيلو');return}
    const r=new FileReader();
    r.onload=()=>{localStorage.setItem(avatarKey(),r.result);menuSheet()};
    r.readAsDataURL(f);
  };
  document.getElementById('tl').onclick=()=>{applyTheme('light');menuSheet()};
  document.getElementById('td').onclick=()=>{applyTheme('dark');menuSheet()};
  const ml=document.getElementById('mlog');
  if(ml)ml.onclick=()=>{close();view='log';render()};
  document.getElementById('mout').onclick=async()=>{close();await sb.auth.signOut();showLogin()};
}

/* ---------- data ---------- */
async function load(){
  const [r,p,t]=await Promise.all([
    sb.from('user_roles').select('role').maybeSingle(),
    sb.from('projects').select('*').order('name'),
    sb.from('transactions').select('*').order('date',{ascending:false})
  ]);
  ROLE=r.data?r.data.role:null;
  P=p.data||[];T=t.data||[];
  if(!ROLE){
    document.getElementById('app').innerHTML='<div class="empty">الحساب ده مش عنده صلاحية. كلم صاحب التطبيق.</div>';
    return;
  }
  render();
}

function showLogin(msg){
  ME=null;ROLE=null;
  document.getElementById('login').style.display='';
  document.getElementById('shell').style.display='none';
  document.getElementById('lerr').textContent=msg||'';
  document.getElementById('em').value=localStorage.getItem('remember_email')||'';
}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('shell').style.display='';
}

document.getElementById('lform').onsubmit=async e=>{
  e.preventDefault();
  const email=document.getElementById('em').value.trim(),password=document.getElementById('pw').value;
  if(!email||!password){document.getElementById('lerr').textContent='اكتب الإيميل والباسورد';return}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById('lerr').textContent='الإيميل أو الباسورد غلط';return}
  if(document.getElementById('rem').checked)localStorage.setItem('remember_email',email);
  else localStorage.removeItem('remember_email');
  document.getElementById('pw').value='';
  boot();
};
document.getElementById('dots').onclick=()=>menuSheet();
document.getElementById('addBtn').onclick=()=>{if(canEdit())txSheet('')};
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')close()});
document.addEventListener('click',e=>{
  const n=e.target.closest('nav [data-v]');if(n){view=n.dataset.v;render();return}
  const f=e.target.closest('[data-f]');if(f){tf=f.dataset.f;render();return}
  const x=e.target.closest('.tx[data-id]');if(x){txSheet(x.dataset.id);return}
  const y=e.target.closest('.p[data-p]');if(y&&canEdit()){prjSheet(y.dataset.p);return}
});

async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data.session){showLogin();return}
  ME={id:data.session.user.id,email:data.session.user.email};
  applyTheme(localStorage.getItem('theme')||'light');
  showApp();
  document.getElementById('app').innerHTML='<div class="empty">جاري التحميل…</div>';
  await load();
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
boot();
</script>
</body>
</html>
